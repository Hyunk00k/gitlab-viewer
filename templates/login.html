
{% extends "layout.html" %}
{% block title %}Login — GitLab Issue Viewer{% endblock %}
{% block content %}
<div class="card">
  <h2>Login</h2>
  <form method="post">
    <label for="url">GitLab URL</label>
    <input id="url" name="url" placeholder="https://gitlab.com" value="{{ default_url }}" readonly>
    <label for="token" style="margin-top:.6rem">Personal Access Token (Service Account)</label>
    <input id="token" name="token" type="password" placeholder="glpat_...">
    <label for="project" style="margin-top:.6rem">Default Project Path or ID (optional)</label>
    <input id="project" name="project" placeholder="group/subgroup/repo or 12345" value="">
    <div class="row" style="margin-top:.7rem">
      <div></div>
      <button type="submit">Login</button>
    </div>
  </form>
</div>
{% endblock %}
